name: Install generated project with dependency caches
description: Restore pnpm store and Chromium caches without caching project environments
inputs:
  project-path:
    description: Generated project directory, relative to the checkout
    required: true
  format:
    description: Normalize newly rendered frontend source
    default: 'false'
  bootstrap:
    description: Create missing locks for unreleased source copies
    default: 'true'
runs:
  using: composite
  steps:
    - name: Enable pnpm
      shell: bash
      run: task tools:setup
    - name: Discover pnpm cache location
      id: pnpm
      shell: bash
      working-directory: ${{ inputs.project-path }}/frontend
      run: |
        echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
        echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
        echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
    - name: Restore pnpm package store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm.outputs.node }}-${{ steps.pnpm.outputs.version }}-${{ hashFiles(format('{0}/frontend/package.json', inputs.project-path), format('{0}/frontend/pnpm-lock.yaml', inputs.project-path)) }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm.outputs.node }}-${{ steps.pnpm.outputs.version }}-
    - name: Bootstrap missing locks
      if: inputs.bootstrap == 'true'
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: task deps:bootstrap
    - name: Install locked dependencies
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: task install
    - name: Normalize frontend formatting
      if: inputs.format == 'true'
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: task ui:format
    - name: Read installed Playwright version
      id: playwright
      shell: bash
      working-directory: ${{ inputs.project-path }}/frontend
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Restore Chromium browser binaries
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - name: Ensure Chromium is installed
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: task browser:install
