name: Template validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Render and lint all 128 feature combinations
        run: task test
  validate:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        jobs: [false, true]
        terminal: [false, true]
        events: [false, true]
        mcp: [false, true]
        schema_forms: [false]
        rss: [false]
        ntfy: [false]
        include:
          - jobs: false
            terminal: false
            events: false
            mcp: false
            schema_forms: true
            rss: false
          - jobs: true
            terminal: true
            events: true
            mcp: true
            schema_forms: true
          - jobs: false
            terminal: false
            events: false
            mcp: false
            schema_forms: false
            rss: true
          - jobs: true
            terminal: true
            events: true
            mcp: true
            schema_forms: true
            rss: true
            ntfy: true
          - jobs: false
            terminal: false
            events: false
            mcp: false
            schema_forms: false
            rss: false
            ntfy: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Render selected variant
        env:
          JOBS: ${{ matrix.jobs }}
          TERMINAL: ${{ matrix.terminal }}
          EVENTS: ${{ matrix.events }}
          MCP: ${{ matrix.mcp }}
          SCHEMA_FORMS: ${{ matrix.schema_forms }}
          RSS: ${{ matrix.rss }}
          NTFY: ${{ matrix.ntfy || false }}
        run: task render:ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: generated/frontend/.node-version
          package-manager-cache: false
      - name: Install dependencies
        id: install
        working-directory: generated
        run: |
          task -d .. tools:setup
          task deps:bootstrap
          task install
          task ui:format
      - name: Start Redis
        if: matrix.jobs
        working-directory: generated
        run: task jobs:redis
      - name: Backend tests
        working-directory: generated
        run: |
          task api:check-code
          task test:ci
          task api:build
      - name: Frontend typecheck and build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: generated
        run: |
          task api:check
          task ui:check
          task ui:build
      - name: Browser tests
        working-directory: generated
        run: |
          task browser:install
          task test:e2e:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ matrix.jobs }}-${{ matrix.terminal }}-${{ matrix.events }}-${{ matrix.mcp }}-${{ matrix.schema_forms }}-${{ matrix.rss }}-${{ matrix.ntfy || false }}
          path: |
            generated/backend.xml
            generated/frontend/browser.xml
            generated/frontend/test-results/
          if-no-files-found: ignore

