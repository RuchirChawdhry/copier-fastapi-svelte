name: Template validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          cache-suffix: preflight
          cache-dependency-glob: |
            template/pyproject.toml.jinja
            template/.python-version
            Taskfile.yml
      - name: Render and lint pairwise feature configurations
        run: task test
      - name: Export validated feature matrix
        id: matrix
        run: echo "value=$(jq -c . tests/feature-matrix.json)" >> "$GITHUB_OUTPUT"
  validate:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: validation-${{ matrix.jobs }}-${{ matrix.events }}-${{ matrix.mcp }}-${{ matrix.rss }}-${{ matrix.ntfy || false }}
          cache-dependency-glob: |
            template/pyproject.toml.jinja
            template/.python-version
            Taskfile.yml
      - name: Render selected variant
        env:
          JOBS: ${{ matrix.jobs }}
          TERMINAL: ${{ matrix.terminal }}
          EVENTS: ${{ matrix.events }}
          MCP: ${{ matrix.mcp }}
          SCHEMA_FORMS: ${{ matrix.schema_forms }}
          RSS: ${{ matrix.rss }}
          NTFY: ${{ matrix.ntfy || false }}
        run: task render:ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: generated/frontend/.node-version
          package-manager-cache: false
      - name: Install dependencies using caches
        id: install
        uses: ./.github/actions/setup-cached-project
        with:
          project-path: generated
          format: 'true'
      - name: Start Redis
        if: matrix.jobs
        working-directory: generated
        run: task jobs:redis
      - name: Backend tests
        working-directory: generated
        run: |
          task api:check-code
          task test:ci
          task api:build
      - name: Frontend typecheck and build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: generated
        run: |
          task api:check
          task ui:check
          task ui:build
      - name: Browser tests
        working-directory: generated
        run: |
          task test:e2e:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ matrix.name }}
          path: |
            generated/backend.xml
            generated/frontend/browser.xml
            generated/frontend/test-results/
          if-no-files-found: ignore

