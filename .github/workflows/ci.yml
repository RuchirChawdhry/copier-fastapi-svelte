name: Template validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Render all 32 feature combinations
        run: uv run --no-project --with copier==9.14.1 --with pytest pytest -q tests
  validate:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        jobs: [false, true]
        terminal: [false, true]
        events: [false, true]
        mcp: [false, true]
        schema_forms: [false]
        include:
          - jobs: false
            terminal: false
            events: false
            mcp: false
            schema_forms: true
          - jobs: true
            terminal: true
            events: true
            mcp: true
            schema_forms: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Render selected variant
        env:
          JOBS: ${{ matrix.jobs }}
          TERMINAL: ${{ matrix.terminal }}
          EVENTS: ${{ matrix.events }}
          MCP: ${{ matrix.mcp }}
          SCHEMA_FORMS: ${{ matrix.schema_forms }}
        run: uvx --from copier==9.14.1 copier copy --defaults --vcs-ref=HEAD -d enable_jobs="$JOBS" -d enable_terminal="$TERMINAL" -d enable_events="$EVENTS" -d enable_mcp="$MCP" -d enable_schema_forms="$SCHEMA_FORMS" . generated
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: generated/frontend/.node-version
          package-manager-cache: false
      - name: Install dependencies
        id: install
        working-directory: generated
        run: |
          npm install -g corepack
          corepack enable pnpm
          uv sync
          cd frontend
          pnpm install --no-frozen-lockfile
          cd ..
          uv run python -m app.cli openapi
          cd frontend
          pnpm api:generate
          pnpm format
      - name: Start Redis
        if: matrix.jobs
        working-directory: generated
        run: docker compose up -d --wait redis
      - name: Backend tests
        working-directory: generated
        run: |
          uv run ruff check app tests
          uv run ty check app
          uv run pytest -q --benchmark-disable --junitxml=backend.xml
          uv build
      - name: Frontend typecheck and build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: generated/frontend
        run: |
          pnpm api:check
          pnpm lint
          pnpm format:check
          pnpm check
          pnpm build
      - name: Browser tests
        working-directory: generated/frontend
        run: |
          pnpm exec playwright install chromium
          PLAYWRIGHT_JUNIT_OUTPUT_FILE=browser.xml pnpm exec playwright test --reporter=list,junit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ matrix.jobs }}-${{ matrix.terminal }}-${{ matrix.events }}-${{ matrix.mcp }}-${{ matrix.schema_forms }}
          path: |
            generated/backend.xml
            generated/frontend/browser.xml
            generated/frontend/test-results/
          if-no-files-found: ignore

