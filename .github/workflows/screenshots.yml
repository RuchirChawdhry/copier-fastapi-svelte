name: Screenshots
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/screenshots.yml']
permissions:
  contents: write
concurrency:
  group: screenshots
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: 3.x
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Generate example application
        run: task render:screenshots
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: generated/frontend/.node-version
          package-manager-cache: false
      - name: Install dependencies
        working-directory: generated
        run: |
          task -d .. tools:setup
          task install
          task browser:install
      - name: Capture screenshots
        timeout-minutes: 5
        working-directory: generated
        env:
          SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
        run: task screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: screenshots
          path: screenshots/*.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: screenshot-debug
          path: generated/frontend/test-results/
          if-no-files-found: ignore
      - name: Commit screenshots
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh application screenshots [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

