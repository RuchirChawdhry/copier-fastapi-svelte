_min_copier_version: "9.14.1"
_subdirectory: template
_templates_suffix: .jinja
_envops:
  trim_blocks: true
  lstrip_blocks: true
  # Svelte uses {#if}/{#each}; these must not be Jinja comment delimiters.
  comment_start_string: '[#'
  comment_end_string: '#]'
project_name:
  type: str
  default: My Application
project_slug:
  type: str
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$')) %}
    Use lowercase letters and digits separated by hyphens.
    {% endif %}
enable_jobs:
  type: bool
  default: false
  help: Include Taskiq and Redis?
enable_terminal:
  type: bool
  default: false
  help: Include authenticated ttyd browser terminal?

enable_events:
  type: bool
  default: false
  help: Include live Server-Sent Events notifications?

enable_mcp:
  type: bool
  default: false
  help: Include FastMCP Streamable HTTP tools?

enable_schema_forms:
  type: bool
  default: false
  help: Include JSON Schema-generated forms (SJSF)?

enable_rss:
  type: bool
  default: false
  help: Include an RSS 2.0 announcement feed (feed.rss)?
